name: Crawl specs and update the main branch

on:
  schedule:
    - cron: '30 */6 * * *' # Every 6 hours for "ed" (nightly) crawls
    - cron: '0 1 * * *'    # Once per day for "tr" (release) crawls
  workflow_dispatch:
    inputs:
      crawlType:
        description: 'What to crawl'
        required: true
        default: 'ed'
        type: choice
        options:
          - ed
          - tr

concurrency:
  group: update
  queue: max

env:
  CRAWL_TYPE: ${{ (github.event.schedule == '30 */6 * * *' || (inputs.crawlType == 'ed')) && 'ed' || 'tr' }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    # Starting with Ubuntu 23+, a security feature prevents running Puppeteer
    # by default. It needs to be disabled. Using the "easiest" option, see:
    # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
    # https://github.com/puppeteer/puppeteer/pull/13196/files
    - name: Disable AppArmor
      run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Setup node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Note: When we crawl nightly versions of specs, we'll also crawl a few
    # additional discontinued specs, kept for cross-referencing purpose.
    - name: Crawl specs with Reffy
      env:
        RELEASE: ${{ (env.CRAWL_TYPE == 'tr') && '--release' || '' }}
        SPECS: ${{ (env.CRAWL_TYPE == 'ed') && 'all DOM-Level-2-Style selectors-nonelement-1 tracking-dnt rfc7230 rfc7231 rfc7232 rfc7233 rfc7234 rfc7235' || 'all' }}
      run: |
        mkdir report
        node_modules/.bin/reffy --post csscomplete --post cssdangling --post annotatelinks --post patchdfns --output report --fallback ${{env.CRAWL_TYPE}}/index.json --spec ${{env.SPECS}} ${{env.RELEASE}}

    # Update another Webref checkout to reduce the chances that the version we
    # checked out is no longer in sync with origin by the time the crawl is over
    - name: Checkout webref once more
      uses: actions/checkout@v7
      with:
        path: webref

    - name: Copy report
      run: rsync -av report/ webref/${{env.CRAWL_TYPE}}/

    - name: Drop extract files from specs that are no longer crawled
      run: node tools/clean-dropped-specs-files.js ${{env.CRAWL_TYPE}}
      working-directory: webref

    - name: Bump minor version of packages if needed
      run: node tools/bump-packages-minor.js
      working-directory: webref

    - name: Push updates to git
      run: |
        git config user.name "reffy-bot"
        git config user.email "<>"
        git remote set-url --push origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
        git add -A
        REFFY_SHA=$(../node_modules/.bin/reffy --version)
        git commit -m "Update of ${{env.CRAWL_TYPE}} report from new reffy run" -m "Using reffy commit $REFFY_SHA."
        git push origin HEAD:main
      working-directory: webref
